<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="storage.js"></script>
<script src="app.js"></script>
<script>
  if ("serviceWorker" in navigator && location.protocol === "https:") {
    window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").then(reg => {
      // Si la app se queda abierta en segundo plano, al volver a ella mira si hay versión nueva (como mucho cada 30 min).
      let last = Date.now();
      document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && Date.now() - last > 18e5) { last = Date.now(); reg.update().catch(() => {}); } });
    }).catch(() => {}));
  }
</script>
